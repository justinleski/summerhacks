id: bump
version: 0.1.0
name: Bump
status: draft
summary: >
  Classic accelerometer bump that pairs two users via time + IP geo
  and opens a durable shared session that can be reopened without bumping again.

goals:
  - Enter explicit Bump Mode, request device-motion permission on user gesture
  - Detect accelerometer peak and create a bump intent on the server
  - Match two intents by time window + coarse Vercel IP geo (no browser geolocation)
  - Create a durable shared session both users can reopen later
  - Confirm peer before activating the session
  - Desktop/dev simulate-bump path without accelerometer

non_goals:
  - Collaborative canvas / WebSocket protocol
  - Browser geolocation / GPS matching
  - Full social feed or photo graph
  - NFC / QR fallback
  - Strong anti-spoofing

constraints:
  deploy: vercel
  db: neon-postgres
  location: ip-geo-only
  realtime_mvp: polling
  auth_mvp: lightweight-device-user

# Ops memories — do not re-litigate
ops:
  local_store_switch: >
    DATABASE_URL unset → in-memory (local two-tab OK).
    DATABASE_URL set → Neon (required on Vercel for two-phone match).
    No separate USE_REMOTE_DB flag. Quote & in .env URLs before sourcing.
  secrets:
    - .env and .env.local are gitignored
    - .env.example stays in git (placeholders only)
    - .vercel/ is gitignored (vercel link per machine)
  vercel_api_entry:
    - api/index.ts + vercel.json rewrite /api/(.*) → /api
    - Never rely on Next-style api/[[...route]].ts on this non-Next project
    - Export named GET/POST/… from hono/vercel handle (default Response ignored)
    - Root package.json must have "type": "module"
    - Dynamic import apps/api/src/app.js to avoid ERR_REQUIRE_ESM
    - Vercel may print drizzle insert TS noise during function build; local typecheck is source of truth
  neon_preview:
    - Free Neon plan is enough for hackathon
    - Enable DATABASE_URL on Preview (Production if used; Development usually no)
    - Skip per-deployment DB branches for MVP
    - db:push once with local DATABASE_URL before relying on Preview bumps
    - Cast match SQL params (::text/::float8) for Neon HTTP driver
    - Verify GET /api/health store === neon
  mobile_preview: >
    Disable Vercel Authentication under Deployment Protection if phones
    should not need a Vercel login. App display-name bootstrap is not that gate.
    Correctness = matched + confirm + shared sessionId (not haptics alone).
  recreate_local:
    - npm install && npm run build -w @summerhacks/shared
    - cp .env.example .env
    - npm run dev  # or vercel link + npm run deploy / deploy:prod
  related_ops_docs:
    - README.md
    - docs/deploy-vercel.md
    - .context/features/bump/BRIEFING.md

stack:
  web: vite-react-ts
  api: hono-vercel
  db: neon-postgres
  orm: drizzle
  monorepo:
    - apps/web
    - apps/api
    - packages/shared

data_model:
  durable:
    - users
    - sessions
    - session_members
  ephemeral:
    - bump_intents
  flexible:
    - sessions.payload jsonb

apis:
  - method: POST
    path: /bumps
    body: [clientTimestamp, peakMagnitude, idempotencyKey]
    notes: Server attaches IP geo from Vercel headers
  - method: GET
    path: /bumps/:id
    notes: Polled while searching; status pending|matched|expired
  - method: DELETE
    path: /bumps/:id
    notes: Cancel when leaving Bump Mode
  - method: GET
    path: /sessions
    notes: Current user recent sessions
  - method: GET
    path: /sessions/:id
  - method: POST
    path: /sessions/:id/confirm
  - method: POST
    path: /users/bootstrap
    notes: Lightweight identity for MVP

flows:
  bump_match:
    - enter_bump_mode
    - request_motion_permission
    - listen_for_accel_peak
    - post_bump_intent
    - poll_until_matched_or_expired
    - confirm_peer
    - open_session
  reopen_session:
    - list_recent_sessions
    - get_session_by_id

ux:
  mode: bump-mode
  states:
    - idle
    - listening
    - bump_detected
    - searching
    - matched_confirm
    - active_session
    - expired
    - no_match
  permissions:
    - device-motion
  haptics: magnitude-linked
  haptics_notes: >
    Android Chrome uses navigator.vibrate; iOS has no vibrate API —
    drive a shared visual intensity meter on all platforms.

matching:
  time_window_ms: 2000
  place: vercel-ip-geo
  expiry_ms: 8000
  poll_interval_ms: 500
  one_to_one: true
  confirm_required: true

related_docs:
  - docs/bump/overview.md
  - docs/bump/architecture.md
  - docs/bump/api.md
  - docs/bump/data-model.md
  - docs/bump/matching.md
  - docs/deploy-vercel.md
  - README.md
  - .context/features/bump/BRIEFING.md
