id: memories
version: 0.2.0
name: Memories
status: implemented
summary: >
  Album receipt interior for a bump session. Same 24h window as pixel covers.
  Members collaboratively add Spotify tracks, photos (pairs), and a shared note.
  Hard-locks at window end into receipt, photobooth strips, and playlists.
  Soft "mark done" does not lock.

goals:
  - Memory row created in pairBumps/tryMatchBump before client polls
  - Window aligned with album covers (albumEditWindowMs / ALBUM_EDIT_WINDOW_MS)
  - Collaborative visibility while open (all photos/songs serialized)
  - Soft submit = marked done only; edits until window end
  - Lock at window end when content exists; expire empty
  - Client JPEG compress before Blob upload
  - Receipt + photobooth + per-member Spotify playlist
  - N-generic (loop session_members)

non_goals:
  - Memories on calendar events (bump-only)
  - Retrofitting pre-feature sessions
  - Public links / feeds
  - Shared collaborative Spotify playlists
  - Spotify search UI (paste link only)
  - WebSockets

constraints:
  auth: requireAuth + session_members membership (403 otherwise)
  window_ms: ALBUM_EDIT_WINDOW_MS (default 86400000)
  songs_per_user: 3
  photos_per_user: 2 | 4 | 6 | 8 (even, max 8)
  note_max: 140
  image_cap: ~4MB server; client compress ~1600px JPEG ~0.72
  blob_path: memories/{sessionId}/{userId}/{ts}.{ext}
  delivery: poll (MEMORY_POLL_INTERVAL_MS = 2000)
  photobooth_slots_per_strip: 4

data_model:
  - memories
  - memory_submissions
  - memory_photos
  - memory_songs
  - memory_playlists
  - spotify_connections
  related: albums / album_votes / album_contests via session_id

apis:
  - method: GET
    path: /api/memories
  - method: GET
    path: /api/memories/session/:sessionId
  - method: GET
    path: /api/memories/:id
  - method: POST
    path: /api/memories/:id/photos
  - method: DELETE
    path: /api/memories/:id/photos/:photoId
  - method: PUT
    path: /api/memories/:id/songs/:position
  - method: DELETE
    path: /api/memories/:id/songs/:position
  - method: PATCH
    path: /api/memories/:id/note
  - method: POST
    path: /api/memories/:id/submit
  - method: POST
    path: /api/memories/:id/export-playlist
  - method: GET
    path: /api/spotify/connect
  - method: GET
    path: /api/spotify/callback
  - method: GET
    path: /api/spotify/status
  - method: DELETE
    path: /api/spotify/disconnect
  - method: GET
    path: /api/internal/sweep-memories
  - method: POST
    path: /api/internal/sweep-memories

ux:
  routes:
    - /memories
    - /memories/:id
    - /memories/session/:sessionId
  home_nav: Memories
  session_cta: >
    /session/:id shows cover contest + "Edit photos + songs" countdown,
    or "View receipt" once locked

ops:
  env:
    - SPOTIFY_CLIENT_ID
    - SPOTIFY_CLIENT_SECRET
    - SPOTIFY_REDIRECT_URI
    - CRON_SECRET
    - BLOB_READ_WRITE_TOKEN
    - ALBUM_EDIT_WINDOW_MS
  cron: vercel.json crons → /api/internal/sweep-memories every 15 min (GET)
  schema: npm run db:push -w @summerhacks/api
  degradation: >
    No Spotify vars → song paste and playlist export 503, everything else works.
    No Blob token → photo upload 503.

related_docs:
  - docs/memories/overview.md
  - docs/memories/architecture.md
  - docs/memories/api.md
  - docs/memories/data-model.md
  - docs/album/overview.md
  - docs/deploy-vercel.md
