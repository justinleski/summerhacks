id: memories
version: 0.1.0
name: Memories
status: implemented
summary: >
  Per-bump-session collaborative keepsake. A 24h window opens at bump match;
  every session member contributes 3 Spotify tracks, photos in pairs, and an
  optional shared title and note. The last submit locks the memory and reveals a
  crumpled-receipt keepsake, polaroid photobooth strips, and per-member Spotify
  playlists.

goals:
  - Memory row created inside tryMatchBump, before the client polls
  - Server-authoritative 24h window from sessions.created_at
  - Per-member submit locks that member permanently (no unlock)
  - BeReal-style reveal — peer content never serialized pre-lock
  - Lock the instant the last member submits
  - Expire (and delete Blob photos) when the window closes with anyone missing
  - Receipt + photobooth strips + private per-member Spotify playlist
  - N-generic throughout (loops session_members, no hardcoded pairs)

non_goals:
  - Memories on calendar events (bump-only)
  - Retrofitting memories onto pre-feature sessions
  - Public links, feeds, or shareable URLs
  - Collaborative/shared playlists
  - Spotify search UI (paste a track link only)
  - WebSockets or push (polls like bump)

constraints:
  auth: requireAuth + session_members membership (403 otherwise)
  window_ms: 86400000
  songs_per_user: 3
  photos_per_user: 2 | 4 | 6 | 8 (even, max 8)
  note_max: 140
  title_max: 40 (optional, enforced in Zod not the DB)
  image_cap: ~4MB, jpeg/png/webp/gif
  blob_path: memories/{sessionId}/{userId}/{ts}.{ext}
  delivery: poll (MEMORY_POLL_INTERVAL_MS = 2000)
  photobooth_slots_per_strip: 4

data_model:
  - memories
  - memory_submissions
  - memory_photos
  - memory_songs
  - memory_playlists
  - spotify_connections

apis:
  - method: GET
    path: /api/memories
  - method: GET
    path: /api/memories/session/:sessionId
  - method: GET
    path: /api/memories/:id
  - method: POST
    path: /api/memories/:id/photos
  - method: DELETE
    path: /api/memories/:id/photos/:photoId
  - method: PUT
    path: /api/memories/:id/songs/:position
  - method: DELETE
    path: /api/memories/:id/songs/:position
  - method: PATCH
    path: /api/memories/:id/note
  - method: PATCH
    path: /api/memories/:id/title
  - method: POST
    path: /api/memories/:id/submit
  - method: POST
    path: /api/memories/:id/export-playlist
  - method: GET
    path: /api/spotify/connect
  - method: GET
    path: /api/spotify/callback
  - method: GET
    path: /api/spotify/status
  - method: DELETE
    path: /api/spotify/disconnect
  - method: GET
    path: /api/internal/sweep-memories
  - method: POST
    path: /api/internal/sweep-memories

ux:
  routes:
    - /memories
    - /memories/:id
    - /memories/session/:sessionId
  home_nav: Memories
  session_cta: /session/:id shows countdown + "Add photos + songs", or "View memory" once locked

ops:
  env:
    - SPOTIFY_CLIENT_ID
    - SPOTIFY_CLIENT_SECRET
    - SPOTIFY_REDIRECT_URI
    - CRON_SECRET
    - BLOB_READ_WRITE_TOKEN
  cron: vercel.json crons → /api/internal/sweep-memories every 15 min (GET)
  schema: npm run db:push -w @summerhacks/api
  degradation: >
    No Spotify vars → song paste and playlist export 503, everything else works.
    No Blob token → photo upload 503.

related_docs:
  - docs/memories/overview.md
  - docs/memories/architecture.md
  - docs/memories/api.md
  - docs/memories/data-model.md
  - docs/deploy-vercel.md
  - .context/features/memories/BRIEFING.md
